<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {
            border: 2px solid rgb(221, 103, 35);
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            margin: auto;
            height: 300px;
            width: 400px;
            background: linear-gradient(#ffd0e6);
            justify-content: center;
        }

        #chibi {
            height: 150px;
            width: 150px;
            background-image: url(chib/defsit.png);
        }

        .screen {
            border-radius: 14px 14px 0 0;
            padding: 10px;
            background-image: url(img/back.png);
            width: 400px;
            height: 220px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            justify-content: center;
        }

        .panel {
            border-radius: 0 0px 14px 14px;
            display: flex;
            align-content: center;
            background-image: src('img/back.png');
            background-color: rgb(255, 250, 236);
            width: 100%;
            height: 60px;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }


        .roundButton {
            font-size: 18pt;
            height: 50px;
            width: 50px;
            border-radius: 100%;
            background-color: rgb(255, 242, 248);
            border-color: #ff986f;
        }
    </style>
</head>

<body>
    <main>
        <div class="block">
            <div class="screen">
                <div id="chibi"></div>
            </div>

            <div class="panel">
                <button class="roundButton" id="eat"> 🍫 </button>
                <button class="roundButton" id="sleep"> 🛌 </button>
                <button class="roundButton" id="heart"> 💗 </button>
            </div>
        </div>
    </main>
    <script>
        const chibi = document.querySelector('#chibi');

        chibi.addEventListener('click', () => {

            chibi.style.transform = 'translateY(-5px)';

            setTimeout(() => {
                chibi.style.transform = '';
            }, 100);

            chibi.style.backgroundImage = 'url(chib/defblush.png)';

            setTimeout(() => {
                chibi.style.backgroundImage = '';
            }, 1000);
        });

        const eat = document.querySelector('#eat');

        eat.addEventListener('click', () => {

            chibi.style.transform = 'scale(1, 0.8)';

            setTimeout(() => {
                chibi.style.transform = '';
            }, 100);

            chibi.style.backgroundImage = 'url(chib/eat.png)';

            setTimeout(() => {
                chibi.style.backgroundImage = '';
            }, 1000);
        });

        const sleep = document.querySelector('#sleep');

        sleep.addEventListener('click', () => {

            chibi.style.transform = 'scale(1, 0.9)';

            setTimeout(() => {
                chibi.style.transform = '';
            }, 100);

            chibi.style.backgroundImage = 'url(chib/eep.gif)';

            setTimeout(() => {
                chibi.style.backgroundImage = '';
            }, 5000);

            chibi.style.width = '200px';

            setTimeout(() => {
                chibi.style.width = '';
            }, 5000);
        });

        const heart = document.querySelector('#heart');

        heart.addEventListener('click', () => {

            var hugs = ['url(chib/hug1.png)', 'url(chib/hug2.png)', 'url(chib/hug3.png)'];

            var randomItem = hugs[Math.floor(Math.random() * hugs.length)];

            chibi.style.backgroundImage = randomItem;

            setTimeout(() => {
                chibi.style.backgroundImage = '';
            }, 2000);

            chibi.style.width = '200px';

            setTimeout(() => {
                chibi.style.width = '';
            }, 2000);
        });

    </script>
</body>

</html>
